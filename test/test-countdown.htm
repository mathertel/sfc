<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown Test</title>
  <link Content-Type="text/css" href="/docstyle.css" rel="stylesheet" />
  <link Content-Type="text/css" href="/test/utils.css" rel="stylesheet" />

  <script src="/loader.js"></script>
  <script>
    window.allSFCLoaded = window.loadComponent(["u-datahub", "u-countdown", "u-markdown"]);
  </script>
</head>

<body class="sitelayout" style="--main-width: 60em">
  <u-datahub></u-datahub>
  <header>
    <h1>Countdown Test</h1>
  </header>

  <main>
    <u-countdown id="counter" dh-path="timer" autostart="1"></u-countdown>
    <p>Time remaining: <output id="countdownValue" aria-live="polite">Loading</output></p>
    <button id="startCountdown" type="button">Start</button>
    <button id="startCountdown12" type="button">Start 00:00:12</button>
    <button id="startFor" type="button">StartFor</button>
    <button id="stopCountdown" type="button">Stop</button>

    <hr>
    <h2>Current Data</h2>
    <div class="data-views">
      <section>
        <h3>DataHub</h3>
        <pre id="hubData" aria-live="polite"></pre>
      </section>
    </div>

    <u-markdown src="../doc/u-countdown.md"></u-markdown>
  </main>

  <script type="module">
    await window.allSFCLoaded;

    const counter = document.querySelector("#counter");
    const output = document.querySelector("#countdownValue");
    const hubData = document.querySelector("#hubData");

    counter.addEventListener("done", () => alert("DONE"));

    window.datahub.publish("timer", "00:01:03");
    output.textContent = window.datahub.get("timer");
    const renderHubData = () => {
      hubData.textContent = JSON.stringify(window.datahub.get(""), null, 2);
    };
    window.datahub.subscribe("**", renderHubData);
    renderHubData();
    window.datahub.subscribe("timer", (_path, value) => {
      output.textContent = value;
    });

    document.querySelector("#startCountdown").addEventListener("click", () => counter.start());
    document.querySelector("#startCountdown12").addEventListener("click", () => counter.start("00:00:12"));
    document.querySelector("#startFor").addEventListener("click", () => counter.startFor("2027-01-01T00:00:00Z"));
    document.querySelector("#stopCountdown").addEventListener("click", () => counter.stop());
  </script>
</body>

</html>
