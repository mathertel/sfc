<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table Sort Test</title>
  <link Content-Type="text/css" href="/docstyle.css" rel="stylesheet" />
  <style>
    .dataTab {
      border-collapse: collapse;
      background-color: white;
      border: solid 1px #203050;
      padding: 0;
      color: #203050;
    }

    .dataTab tr:nth-child(even) {
      background: #ddd
    }

    .dataTab tr:nth-child(odd) {
      background: #eee
    }

    .dataTab td,
    .dataTab th {
      border: solid 1px #203050;
      padding: 0.25em 0.8em;
    }

    .dataTab thead th {
      background-color: #203050;
      color: white;
      cursor: pointer;
    }
  </style>

  <script src="/loader.js"></script>
  <script>
    var allSFCLoaded = window.loadComponent(['u-tablesort', 'u-format', 'u-tablesum', 'u-markdown']);
  </script>
</head>

<body class="sitelayout" style="--main-width: 60em">
  <header>
    <h1>Table Sort Test</h1>
  </header>
  <main>
    <table is="u-tablesort" class="dataTab">
      <thead>
        <tr>
          <th sort="num">id</th>
          <th sort>web site</th>
          <th sort>purpose</th>
          <th sort style="text-align: right;">amount</th>
          <th sort='date'>last online</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>amazon</td>
          <td>shopping</td>
          <td style="text-align: right;"><u-format currency="EUR">188.56</u-format></td>
          <td>2023-10-01</td>
        </tr>
        <tr>
          <td>2</td>
          <td>google</td>
          <td>searching</td>
          <td style="text-align: right;"><u-format currency="EUR">12.00</u-format></td>
          <td>2023-10-02</td>
        </tr>
        <tr>
          <td>13</td>
          <td>outlook</td>
          <td>E-Mail</td>
          <td style="text-align: right;"><u-format currency="EUR">3000.11</u-format></td>
          <td>2023-10-03</td>
        </tr>
        <tr>
          <td>4</td>
          <td>eBay</td>
          <td>commerce</td>
          <td style="text-align: right;"><u-format currency="EUR">5</u-format></td>
          <td>2023-10-01</td>
        </tr>
        <tr>
          <td>5</td>
          <td>example</td>
          <td>dummy</td>
          <td style="text-align: right;"><u-format currency="EUR">100</u-format></td>
          <td>2022-10-01</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td> </td>
          <td></td>
          <td></td>
          <td style="text-align: right;"><u-format currency="EUR"><u-tablesum></u-tablesum></u-format></td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <hr />

    <u-markdown src="../doc/u-tablesort.md"></u-markdown>

  </main>
